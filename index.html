  <style>
    :root,
    [data-theme="light"] {
      --bg-rail: #F4F5F3;
      --bg-pane: #FFFFFF;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --bg-subtle: #EAECE9;
      --bg-active: #E0EFEA;
      --bg-3d: radial-gradient(120% 95% at 50% 8%, #FBFDFB 0%, #EEF2EE 56%, #D9E4DE 100%);
      --ink-primary: #14171A;
      --ink-muted: #4A525A;
      --ink-active: #0A4A41;
      --border-subtle: #D4D8D4;
      --border-strong: #7A8288;
      --accent: #0D5C51;
      --accent-hover: #09453D;
      --accent-ink: #FFFFFF;
      --error: #B42318;
      --error-bg: #FEF2F2;
      --focus-ring: #0D5C51;
      --shadow-hud: 0 12px 32px rgba(20, 23, 26, 0.12);
    }

    [data-theme="dark"] {
      --bg-rail: #0F1214;
      --bg-pane: #161B1E;
      --bg-glass: rgba(20, 26, 30, 0.9);
      --bg-subtle: #1E2529;
      --bg-active: #16322E;
      --bg-3d: radial-gradient(120% 95% at 50% 8%, #1A252A 0%, #0F1518 60%, #080B0D 100%);
      --ink-primary: #F1F3F2;
      --ink-muted: #A6B0B8;
      --ink-active: #3FD4BE;
      --border-subtle: #2A3339;
      --border-strong: #5A6770;
      --accent: #3FD4BE;
      --accent-hover: #64E0CE;
      --accent-ink: #0B1A18;
      --error: #FCA5A5;
      --error-bg: #2A1618;
      --focus-ring: #3FD4BE;
      --shadow-hud: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    body {
      background-color: var(--bg-rail);
      color: var(--ink-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 240ms ease, color 220ms ease;
    }

    a[href],
    button:not(:disabled),
    summary,
    select:not(:disabled),
    label[for],
    [role="button"]:not([aria-disabled="true"]),
    [role="tab"]:not([aria-disabled="true"]) {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .font-editorial {
      font-family: 'Fraunces', Georgia, serif;
    }

    .bg-rail { background-color: var(--bg-rail); color: var(--ink-primary); }
    .bg-pane { background-color: var(--bg-pane); color: var(--ink-primary); }
    .bg-glass { background-color: var(--bg-glass); color: var(--ink-primary); box-shadow: var(--shadow-hud); }
    .bg-subtle { background-color: var(--bg-subtle); color: var(--ink-primary); }
    .bg-active { background-color: var(--bg-active); color: var(--ink-active); }
    .ink-muted { color: var(--ink-muted); }
    .ink-accent { color: var(--accent); }
    .line-subtle { border-color: var(--border-subtle); }
    .line-strong { border-color: var(--border-strong); }
    .bg-error { background-color: var(--error-bg); color: var(--error); border-color: var(--error); }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-ink);
      border: 1.5px solid var(--accent);
      transition: background-color 150ms ease, transform 140ms ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--bg-pane);
      color: var(--ink-primary);
      border: 1.5px solid var(--border-strong);
      transition: background-color 150ms ease, border-color 150ms ease, transform 140ms ease;
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
      border-color: var(--ink-primary);
      transform: translateY(-1px);
    }

    .zone-pin {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate3d(-999px, -999px, 0);
      will-change: transform;
      pointer-events: auto;
    }

    .zone-pin-btn {
      translate: -50% -100%;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 6px 12px;
      border: 1.5px solid var(--border-subtle);
      border-radius: 10px;
      background-color: var(--bg-glass);
      color: var(--ink-primary);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-hud);
      white-space: nowrap;
      transition: border-color 150ms ease, transform 150ms ease;
    }

    .zone-pin-btn:hover,
    .zone-pin-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background-color: var(--accent);
      color: var(--accent-ink);
    }

    .drawer-anim {
      animation: drawerIn 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes drawerIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .stagger-card {
      animation: cardRise 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardRise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .drawer-anim, .stagger-card { animation: none; }
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>

<body class="antialiased overflow-x-clip">
  <div id="root"></div>
  <noscript>
    <div style="max-width:640px;margin:48px auto;padding:24px;border:1.5px solid #0D5C51;border-radius:12px;font-family:sans-serif;background:#FFFFFF;color:#14171A;">
      <h1 style="margin:0 0 12px;color:#0D5C51;">MaveyyVlgd (Muhammad Adhitya Pratama)</h1>
      <p style="margin:0 0 12px;">Interactive 3D Studio requires JavaScript. You can still visit <a href="./kalkulatorstatistik/index.html" style="color:#0D5C51;">Kalkulator Statistik RS</a>, <a href="./netflix-app/index.html" style="color:#0D5C51;">StreamFlix</a>, or <a href="https://github.com/Mavey15" style="color:#0D5C51;">GitHub @Mavey15</a>.</p>
    </div>
  </noscript>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const VIEWS = [
      { id: "overview", label: "Overview", pinLabel: "Studio" },
      { id: "projects", label: "Projects", pinLabel: "Workstation · 6 Drops" },
      { id: "about", label: "About", pinLabel: "RMIK Archive" },
      { id: "contact", label: "Contact", pinLabel: "Lounge & Contact" },
    ];

    function parseHash() {
      const h = (window.location.hash || "").replace("#", "").toLowerCase();
      if (h === "projects" || h === "about" || h === "contact" || h === "overview") return h;
      return "overview";
    }

    function MaveyyPortfolio3D() {
      const data = window.PORTFOLIO_DATA;

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem("maveyy-theme-3d") === "dark" ? "dark" : "light"; }
        catch { return "light"; }
      });
      const [mode3D, setMode3D] = useState(true);
      const [activeView, setActiveView] = useState(parseHash);
      const [drawerOpen, setDrawerOpen] = useState(() => window.innerWidth >= 1024);
      const [autoOrbit, setAutoOrbit] = useState(false);

      const [selectedProjectId, setSelectedProjectId] = useState(() =>
        data && data.projects && data.projects[0] ? data.projects[0].id : ""
      );
      const [selectedCategory, setSelectedCategory] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [skillTab, setSkillTab] = useState("vibecoding");
      const [copiedEmail, setCopiedEmail] = useState(false);
      const [wibTime, setWibTime] = useState("--:-- WIB");
      const [senderName, setSenderName] = useState("");
      const [senderMsg, setSenderMsg] = useState("");
      const [formError, setFormError] = useState("");
      const [msgSentNotice, setMsgSentNotice] = useState("");
      const [avatarError, setAvatarError] = useState(false);

      const canvasHostRef = useRef(null);
      const sceneApiRef = useRef(null);
      const pinElsRef = useRef(new Map());
      const msgFieldRef = useRef(null);

      const isDark = theme === "dark";

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", isDark ? "#0F1214" : "#F4F5F3");
        try { localStorage.setItem("maveyy-theme-3d", theme); } catch {}
      }, [theme, isDark]);

      useEffect(() => {
        const tick = () => {
          try {
            const f = new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Jakarta",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
            setWibTime(`${f.format(new Date())} WIB`);
          } catch { setWibTime("WIB +7"); }
        };
        tick();
        const id = setInterval(tick, 15000);
        return () => clearInterval(id);
      }, []);

      // Mount / sync Three.js 3D Studio
      useEffect(() => {
        if (!mode3D) return;
        let cancelled = false;
        let retries = 0;

        const tryMount = () => {
          if (cancelled || !canvasHostRef.current) return;
          if (typeof window.mountMaveyyStudio3D !== "function") {
            if (retries++ < 40) setTimeout(tryMount, 80);
            else setMode3D(false);
            return;
          }
          sceneApiRef.current = window.mountMaveyyStudio3D(canvasHostRef.current, {
            dark: isDark,
            activeView,
            autoOrbit,
            getPinEl: (id) => pinElsRef.current.get(id),
            onUserInteract: () => setAutoOrbit(false),
            onSelectZone: (zone) => {
              setActiveView(zone);
              setAutoOrbit(false);
              if (zone !== "overview") setDrawerOpen(true);
              history.replaceState(null, "", `#${zone}`);
            },
            onFallback: () => setMode3D(false),
          });
        };
        tryMount();

        return () => {
          cancelled = true;
          sceneApiRef.current?.destroy();
          sceneApiRef.current = null;
        };
      }, [mode3D]);

      useEffect(() => {
        sceneApiRef.current?.update({ dark: isDark, activeView, autoOrbit });
      }, [isDark, activeView, autoOrbit]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape" && mode3D && drawerOpen) setDrawerOpen(false);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [mode3D, drawerOpen]);

      if (!data) {
        return (
          <main className="min-h-screen flex items-center justify-center p-6 bg-rail">
            <div className="max-w-md p-6 rounded-xl bg-pane border line-strong">
              <h1 className="font-editorial text-xl font-bold">Portfolio data could not be loaded</h1>
              <p className="text-sm ink-muted mt-2">Ensure src/data/portfolioData.js is reachable and reload.</p>
            </div>
          </main>
        );
      }

      const { profile, about, skills, projects, contact } = data;

      const selectView = (viewId) => {
        setActiveView(viewId);
        setAutoOrbit(false);
        setDrawerOpen(true);
        history.replaceState(null, "", `#${viewId}`);
      };

      const categories = useMemo(
        () => ["ALL", ...Array.from(new Set(projects.map((p) => p.category)))],
        [projects]
      );

      const filteredProjects = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return projects.filter((p) => {
          const catOk = selectedCategory === "ALL" || p.category === selectedCategory;
          const qOk =
            !q ||
            p.title.toLowerCase().includes(q) ||
            p.subtitle.toLowerCase().includes(q) ||
            p.summary.toLowerCase().includes(q) ||
            p.techStack.some((t) => t.toLowerCase().includes(q));
          return catOk && qOk;
        });
      }, [projects, selectedCategory, searchQuery]);

      const selectedProject =
        filteredProjects.find((p) => p.id === selectedProjectId) || filteredProjects[0] || null;
      const selectedIdx = selectedProject
        ? filteredProjects.findIndex((p) => p.id === selectedProject.id)
        : -1;

      const liveDemoProjects = projects.filter((p) => p.liveUrl && p.liveUrl.startsWith("./"));
      const activeSkillCat = skills.categories.find((c) => c.id === skillTab) || skills.categories[0];

      const handleCopyEmail = () => {
        const done = () => {
          setCopiedEmail(true);
          setTimeout(() => setCopiedEmail(false), 2400);
        };
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(contact.email).then(done).catch(done);
        else done();
      };

      const handleDispatch = (channel, e) => {
        if (e) e.preventDefault();
        const trimmed = senderMsg.trim();
        if (!trimmed) {
          setFormError("Write a short message or project idea before sending.");
          setMsgSentNotice("");
          msgFieldRef.current?.focus();
          return;
        }
        setFormError("");
        const who = senderName.trim() || "Website Visitor";
        const body = `Hi ${profile.fullName},\n\nI'm ${who}.\n\n${trimmed}`;
        if (channel === "email") {
          window.location.href = `mailto:${contact.email}?subject=${encodeURIComponent(
            `Message from ${who} via MaveyyVlgd 3D Studio`
          )}&body=${encodeURIComponent(body)}`;
          setMsgSentNotice(`Opening your email app addressed to ${contact.email}.`);
        } else {
          const ig = contact.socials.find((s) => s.platform === "Instagram");
          if (ig) window.open(ig.url, "_blank", "noopener,noreferrer");
          setMsgSentNotice("Opening Instagram (@a.prtamaa1) in a new tab.");
        }
      };

      // Shared view content (used inside both 3D Right Drawer AND 2D Ringkas Workspace!)
      const renderActiveContent = () => {
        if (activeView === "overview") {
          return (
            <div key="overview" className="stagger-card space-y-6">
              <div className="flex items-center gap-4">
                <div className="w-16 h-16 rounded-xl overflow-hidden border line-subtle bg-subtle shrink-0">
                  {!avatarError ? (
                    <img
                      src={profile.avatarUrl}
                      alt={`Portrait of ${profile.fullName}`}
                      width="64"
                      height="64"
                      fetchpriority="high"
                      onError={() => setAvatarError(true)}
                      className="w-full h-full object-cover"
                    />
                  ) : (
                    <div className="w-full h-full flex items-center justify-center font-editorial font-bold ink-accent">
                      MV
                    </div>
                  )}
                </div>
                <div className="min-w-0">
                  <p className="font-mono text-[11px] font-semibold ink-accent">
                    {profile.location} · {wibTime}
                  </p>
                  <div className="font-semibold text-base leading-tight truncate">{profile.fullName}</div>
                  <div className="text-xs ink-muted truncate">{profile.role}</div>
                </div>
              </div>

              <div className="space-y-2.5">
                <h1 className="font-editorial text-2xl sm:text-3xl font-bold leading-tight">
                  {profile.headlineTop}{" "}
                  <span className="ink-accent">{profile.headlineAccent}</span>
                </h1>
                <p className="text-sm leading-relaxed ink-muted">{profile.shortBio}</p>
              </div>

              <dl className="grid grid-cols-3 gap-2.5 pt-2">
                {profile.stats.map((st) => (
                  <div key={st.code} className="p-3 rounded-xl bg-rail border line-subtle">
                    <dd className="font-editorial text-xl font-bold">{st.value}</dd>
                    <dt className="font-mono text-[10px] ink-muted mt-0.5 leading-tight">{st.label}</dt>
                  </div>
                ))}
              </dl>

              <div className="flex flex-wrap gap-2.5">
                <button
                  type="button"
                  onClick={() => selectView("projects")}
                  className="min-h-[44px] px-4 py-2 rounded-lg btn-primary text-xs font-semibold"
                >
                  Inspect {projects.length} Drops
                </button>
                <button
                  type="button"
                  onClick={() => selectView("contact")}
                  className="min-h-[44px] px-4 py-2 rounded-lg btn-secondary text-xs font-semibold"
                >
                  Contact Me
                </button>
              </div>

              <div className="space-y-2.5 pt-2 border-t line-subtle">
                <div className="font-mono text-[11px] font-semibold ink-muted uppercase">
                  Built-in Live Demos
                </div>
                <div className="grid grid-cols-1 gap-2">
                  {liveDemoProjects.map((demo) => (
                    <div
                      key={demo.id}
                      className="p-3.5 rounded-xl bg-rail border line-subtle flex items-center justify-between gap-3"
                    >
                      <div className="min-w-0">
                        <div className="font-semibold text-sm truncate">{demo.title}</div>
                        <div className="text-xs ink-muted truncate">{demo.category}</div>
                      </div>
                      <a
                        href={demo.liveUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="min-h-[40px] px-3 rounded-lg btn-primary text-xs font-semibold inline-flex items-center shrink-0"
                      >
                        Launch
                      </a>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        if (activeView === "projects") {
          return (
            <div key="projects" className="stagger-card space-y-4">
              <div>
                <p className="font-mono text-[11px] font-semibold ink-accent">
                  WORKSTATION ARCHIVE · {filteredProjects.length} OF {projects.length}
                </p>
                <h2 className="font-editorial text-2xl font-bold mt-0.5">Selected Drops</h2>
              </div>

              <div>
                <label htmlFor="project-search" className="sr-only">Search projects</label>
                <input
                  id="project-search"
                  type="search"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search project or stack..."
                  className="min-h-[44px] w-full px-3.5 py-2 rounded-lg bg-rail border line-strong text-sm"
                />
              </div>

              <div className="flex flex-wrap gap-1.5" role="group" aria-label="Filter category">
                {categories.map((cat) => (
                  <button
                    key={cat}
                    type="button"
                    aria-pressed={selectedCategory === cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`min-h-[40px] px-3 py-1.5 rounded-lg text-xs font-semibold ${
                      selectedCategory === cat ? "btn-primary" : "btn-secondary"
                    }`}
                  >
                    {cat === "ALL" ? `All (${projects.length})` : cat}
                  </button>
                ))}
              </div>

              {filteredProjects.length === 0 ? (
                <div className="p-6 rounded-xl bg-rail border border-dashed line-strong text-center space-y-3">
                  <p className="text-sm font-semibold">No projects match "{searchQuery}".</p>
                  <button
                    type="button"
                    onClick={() => { setSelectedCategory("ALL"); setSearchQuery(""); }}
                    className="min-h-[44px] px-4 rounded-lg btn-primary text-xs font-semibold"
                  >
                    Reset Filters
                  </button>
                </div>
              ) : (
                <>
                  <div className="grid grid-cols-1 gap-2" aria-label="Project list">
                    {filteredProjects.map((p) => {
                      const sel = selectedProject?.id === p.id;
                      return (
                        <button
                          key={p.id}
                          type="button"
                          aria-pressed={sel}
                          onClick={() => setSelectedProjectId(p.id)}
                          className={`w-full p-3 rounded-xl border text-left transition-colors ${
                            sel ? "bg-active border-[var(--accent)]" : "bg-rail line-subtle hover:line-strong"
                          }`}
                        >
                          <div className="flex items-center justify-between gap-2 font-mono text-[11px]">
                            <span className="font-semibold ink-accent">{p.dropNumber}</span>
                            <span className="ink-muted">{p.year}</span>
                          </div>
                          <div className="font-semibold text-sm mt-0.5">{p.title}</div>
                        </button>
                      );
                    })}
                  </div>

                  {selectedProject && (
                    <article
                      key={selectedProject.id}
                      className="stagger-card p-4 rounded-xl bg-rail border line-subtle space-y-4"
                    >
                      <div>
                        <div className="font-mono text-[11px] font-semibold ink-accent">
                          {selectedProject.dropNumber} · {selectedProject.category}
                        </div>
                        <h3 className="font-editorial text-xl font-bold mt-0.5">
                          {selectedProject.title}
                        </h3>
                        <p className="text-xs ink-muted mt-1">{selectedProject.subtitle}</p>
                      </div>

                      <p className="text-sm leading-relaxed">{selectedProject.summary}</p>

                      {selectedProject.features && (
                        <ol className="space-y-1.5 text-xs ink-muted">
                          {selectedProject.features.map((f, i) => (
                            <li key={i} className="flex gap-2">
                              <span className="font-mono font-semibold ink-accent shrink-0">0{i + 1}</span>
                              <span>{f}</span>
                            </li>
                          ))}
                        </ol>
                      )}

                      <div className="flex flex-wrap gap-1.5">
                        {selectedProject.techStack.map((t, i) => (
                          <span key={i} className="font-mono text-[11px] px-2 py-0.5 rounded bg-subtle">
                            {t}
                          </span>
                        ))}
                      </div>

                      <div className="flex flex-wrap gap-2 pt-2 border-t line-subtle">
                        {selectedProject.liveUrl && (
                          <a
                            href={selectedProject.liveUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="min-h-[44px] px-4 rounded-lg btn-primary text-xs font-semibold inline-flex items-center"
                          >
                            Open Live App
                          </a>
                        )}
                        {selectedProject.repoUrl && (
                          <a
                            href={selectedProject.repoUrl}
                            target="_blank"
                            rel="noreferrer"
                            className="min-h-[44px] px-4 rounded-lg btn-secondary text-xs font-semibold inline-flex items-center"
                          >
                            GitHub Repo
                          </a>
                        )}
                      </div>

                      <div className="flex items-center justify-between gap-2 pt-2 border-t line-subtle">
                        <button
                          type="button"
                          disabled={selectedIdx <= 0}
                          onClick={() => selectedIdx > 0 && setSelectedProjectId(filteredProjects[selectedIdx - 1].id)}
                          className="min-h-[40px] px-3 rounded-lg btn-secondary text-xs font-semibold"
                        >
                          Previous
                        </button>
                        <span className="font-mono text-xs ink-muted">
                          {selectedIdx + 1} / {filteredProjects.length}
                        </span>
                        <button
                          type="button"
                          disabled={selectedIdx >= filteredProjects.length - 1}
                          onClick={() =>
                            selectedIdx < filteredProjects.length - 1 &&
                            setSelectedProjectId(filteredProjects[selectedIdx + 1].id)
                          }
                          className="min-h-[40px] px-3 rounded-lg btn-secondary text-xs font-semibold"
                        >
                          Next
                        </button>
                      </div>
                    </article>
                  )}
                </>
              )}
            </div>
          );
        }

        if (activeView === "about") {
          return (
            <div key="about" className="stagger-card space-y-5">
              <div>
                <p className="font-mono text-[11px] font-semibold ink-accent">RMIK ARCHIVE & MANIFESTO</p>
                <h2 className="font-editorial text-2xl font-bold mt-0.5">{about.title}</h2>
              </div>

              <blockquote className="pl-4 border-l-4 border-[var(--accent)] font-editorial text-base leading-snug">
                {about.quote}
              </blockquote>

              <div className="space-y-3 text-sm leading-relaxed ink-muted">
                {about.paragraphs.map((p, i) => <p key={i}>{p}</p>)}
              </div>

              <div className="pt-2 border-t line-subtle space-y-3">
                <div role="tablist" aria-label="Skill domains" className="flex flex-wrap gap-1.5">
                  {skills.categories.map((cat) => (
                    <button
                      key={cat.id}
                      type="button"
                      role="tab"
                      aria-selected={activeSkillCat.id === cat.id}
                      onClick={() => setSkillTab(cat.id)}
                      className={`min-h-[40px] px-3 rounded-lg text-xs font-semibold ${
                        activeSkillCat.id === cat.id ? "btn-primary" : "btn-secondary"
                      }`}
                    >
                      {cat.id === "vibecoding" ? "Vibe Coding" : cat.id === "rmik" ? "RMIK Domain" : "Daily Culture"}
                    </button>
                  ))}
                </div>

                <ul role="tabpanel" className="divide-y line-subtle border-t line-subtle">
                  {activeSkillCat.items.map((item) => (
                    <li key={item.name} className="py-3 space-y-1">
                      <div className="flex items-baseline justify-between gap-2">
                        <span className="font-semibold text-sm">{item.name}</span>
                        <span className="font-mono text-[10px] px-2 py-0.5 rounded bg-subtle shrink-0">
                          {item.tag}
                        </span>
                      </div>
                      <p className="text-xs ink-muted leading-relaxed">{item.detail}</p>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          );
        }

        return (
          <div key="contact" className="stagger-card space-y-5">
            <div>
              <p className="font-mono text-[11px] font-semibold ink-accent">LOUNGE & DIRECT CHANNELS</p>
              <h2 className="font-editorial text-2xl font-bold mt-0.5">{contact.headline}</h2>
              <p className="text-sm ink-muted mt-2 leading-relaxed">{contact.subheadline}</p>
            </div>

            <div className="p-3.5 rounded-xl bg-rail border line-subtle flex items-center justify-between gap-3">
              <div className="min-w-0">
                <div className="font-mono text-[10px] ink-muted">Direct Email</div>
                <div className="font-mono text-xs font-semibold break-all">{contact.email}</div>
              </div>
              <button
                type="button"
                onClick={handleCopyEmail}
                className="min-h-[40px] px-3.5 rounded-lg btn-primary text-xs font-semibold shrink-0"
              >
                {copiedEmail ? "Copied!" : "Copy Email"}
              </button>
            </div>

            <ul className="divide-y line-subtle border-y line-subtle">
              {contact.socials.map((soc) => (
                <li key={soc.platform}>
                  <a
                    href={soc.url}
                    target="_blank"
                    rel="noreferrer"
                    className="min-h-[48px] py-2.5 flex items-center justify-between gap-2 hover:opacity-80"
                  >
                    <div className="min-w-0">
                      <div className="font-semibold text-sm">{soc.platform}</div>
                      <div className="font-mono text-xs ink-muted truncate">{soc.handle}</div>
                    </div>
                    <span className="font-mono text-xs font-semibold ink-accent">Open</span>
                  </a>
                </li>
              ))}
            </ul>

            <form onSubmit={(e) => handleDispatch("email", e)} noValidate className="space-y-3">
              <div className="space-y-1">
                <label htmlFor="sender-name" className="block text-xs font-semibold">Your Name</label>
                <input
                  id="sender-name"
                  type="text"
                  value={senderName}
                  onChange={(e) => setSenderName(e.target.value)}
                  placeholder="Your Name"
                  className="min-h-[44px] w-full px-3 py-2 rounded-lg bg-rail border line-strong text-sm"
                />
              </div>
              <div className="space-y-1">
                <label htmlFor="sender-msg" className="block text-xs font-semibold">Message</label>
                <textarea
                  ref={msgFieldRef}
                  id="sender-msg"
                  rows={3}
                  value={senderMsg}
                  onChange={(e) => { setSenderMsg(e.target.value); if (formError) setFormError(""); }}
                  placeholder="Drop your project idea or question..."
                  className="w-full px-3 py-2 rounded-lg bg-rail border line-strong text-sm"
                />
              </div>
              {formError && (
                <div role="alert" className="p-2.5 rounded-lg border bg-error text-xs font-semibold">
                  Error: {formError}
                </div>
              )}
              {msgSentNotice && (
                <div role="status" className="p-2.5 rounded-lg bg-active text-xs font-semibold">
                  {msgSentNotice}
                </div>
              )}
              <div className="grid grid-cols-2 gap-2">
                <button type="submit" className="min-h-[44px] rounded-lg btn-primary text-xs font-semibold">
                  Send via Email
                </button>
                <button
                  type="button"
                  onClick={() => handleDispatch("instagram")}
                  className="min-h-[44px] rounded-lg btn-secondary text-xs font-semibold"
                >
                  DM Instagram
                </button>
              </div>
            </form>
          </div>
        );
      };

      // Mode 2D Ringkas
      if (!mode3D) {
        return (
          <div className="min-h-screen bg-rail">
            <header className="sticky top-0 z-40 bg-pane border-b line-subtle">
              <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <span className="font-editorial font-bold text-base">{profile.name}</span>
                  <span className="font-mono text-xs ink-muted hidden sm:inline">Mode 2D Ringkas</span>
                </div>
                <nav aria-label="2D Sections" className="hidden md:flex items-center gap-1">
                  {VIEWS.map((v) => (
                    <button
                      key={v.id}
                      type="button"
                      onClick={() => selectView(v.id)}
                      className={`min-h-[44px] px-3 rounded-lg text-xs font-semibold ${
                        activeView === v.id ? "btn-primary" : "btn-secondary"
                      }`}
                    >
                      {v.label}
                    </button>
                  ))}
                </nav>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => setMode3D(true)}
                    className="min-h-[44px] px-3.5 rounded-lg btn-primary text-xs font-semibold"
                  >
                    Masuk 3D Studio
                  </button>
                  <button
                    type="button"
                    onClick={() => setTheme(isDark ? "light" : "dark")}
                    className="min-h-[44px] px-3 rounded-lg btn-secondary text-xs font-semibold"
                  >
                    {isDark ? "Light" : "Dark"}
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-3xl mx-auto px-4 py-8 pb-24">
              <div className="p-6 sm:p-8 rounded-2xl bg-pane border line-subtle">
                {renderActiveContent()}
              </div>
            </main>

            <nav aria-label="Mobile 2D navigation" className="md:hidden fixed bottom-0 left-0 right-0 bg-pane border-t line-subtle grid grid-cols-4">
              {VIEWS.map((v) => (
                <button
                  key={v.id}
                  type="button"
                  onClick={() => selectView(v.id)}
                  className={`min-h-[54px] text-xs font-semibold ${
                    activeView === v.id ? "ink-accent border-t-2 border-[var(--accent)]" : "ink-muted"
                  }`}
                >
                  {v.label}
                </button>
              ))}
            </nav>
          </div>
        );
      }

      // Mode Utama: Full Interactive 3D Studio + Right Drawer
      return (
        <div
          className="fixed inset-0 overflow-hidden"
          style={{ background: "var(--bg-3d)" }}
        >
          <a
            href="#studio-drawer"
            className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:px-4 focus:py-2.5 rounded-lg btn-primary text-xs font-semibold"
          >
            Skip to studio content
          </a>

          {/* Fullscreen 3D Canvas */}
          <div ref={canvasHostRef} className="absolute inset-0 w-full h-full" />

          {/* Interactive 3D Floating Zone Pins */}
          <div className="absolute inset-0 pointer-events-none z-10">
            {VIEWS.filter((v) => v.id !== "overview").map((v) => (
              <div
                key={v.id}
                className="zone-pin"
                ref={(el) => {
                  if (el) pinElsRef.current.set(v.id, el);
                  else pinElsRef.current.delete(v.id);
                }}
              >
                <button
                  type="button"
                  aria-pressed={activeView === v.id}
                  onClick={() => selectView(v.id)}
                  className="zone-pin-btn"
                >
                  <span className="w-2 h-2 rounded-full bg-current" aria-hidden="true" />
                  <span>{v.pinLabel}</span>
                </button>
              </div>
            ))}
          </div>

          {/* Top Floating Studio Header */}
          <header className="absolute top-0 left-0 right-0 z-20 p-3 sm:p-4 flex flex-wrap items-center justify-between gap-2.5 pointer-events-none">
            <button
              type="button"
              onClick={() => selectView("overview")}
              className="pointer-events-auto min-h-[46px] px-3.5 py-2 rounded-2xl bg-glass border line-subtle flex items-center gap-2.5 text-left"
            >
              <span className="w-8 h-8 rounded-lg overflow-hidden border line-subtle bg-subtle shrink-0 inline-block">
                {!avatarError ? (
                  <img src={profile.avatarUrl} alt={profile.fullName} width="32" height="32" className="w-full h-full object-cover" />
                ) : (
                  <span className="w-full h-full flex items-center justify-center font-editorial text-xs font-bold ink-accent">MV</span>
                )}
              </span>
              <span className="leading-tight">
                <span className="block font-editorial font-bold text-sm">{profile.name}</span>
                <span className="block font-mono text-[10px] ink-muted">{wibTime} · Pacitan</span>
              </span>
            </button>

            <nav
              aria-label="Studio zones"
              className="pointer-events-auto order-3 lg:order-2 w-full lg:w-auto flex items-center justify-between lg:justify-center gap-1 p-1 rounded-xl bg-glass border line-subtle"
            >
              {VIEWS.map((v) => (
                <button
                  key={v.id}
                  type="button"
                  aria-pressed={activeView === v.id}
                  onClick={() => selectView(v.id)}
                  className={`flex-1 lg:flex-none min-h-[40px] px-3.5 rounded-lg text-xs font-semibold transition-colors ${
                    activeView === v.id ? "btn-primary" : "ink-muted hover:bg-subtle"
                  }`}
                >
                  {v.id === "projects" ? `Projects (${projects.length})` : v.label}
                </button>
              ))}
            </nav>

            <div className="pointer-events-auto order-2 lg:order-3 flex items-center gap-2">
              <button
                type="button"
                onClick={() => setMode3D(false)}
                className="min-h-[44px] px-3 rounded-xl bg-glass border line-subtle text-xs font-semibold hover:border-[var(--accent)]"
              >
                Mode 2D
              </button>
              <button
                type="button"
                aria-pressed={isDark}
                onClick={() => setTheme(isDark ? "light" : "dark")}
                className="min-h-[44px] px-3 rounded-xl bg-glass border line-subtle text-xs font-semibold hover:border-[var(--accent)]"
              >
                {isDark ? "Night" : "Light"}
              </button>
              <button
                type="button"
                aria-expanded={drawerOpen}
                onClick={() => setDrawerOpen((o) => !o)}
                className="min-h-[44px] px-3.5 rounded-xl btn-primary text-xs font-semibold"
              >
                {drawerOpen ? "Tutup Panel" : "Buka Panel"}
              </button>
            </div>
          </header>

          {/* Bottom-Left 3D Camera Controls */}
          <nav
            aria-label="3D Camera Controls"
            className="absolute left-3 sm:left-4 bottom-3 sm:bottom-4 z-20 flex items-center gap-1.5 p-1.5 rounded-2xl bg-glass border line-subtle"
          >
            <button
              type="button"
              aria-pressed={autoOrbit}
              onClick={() => {
                setActiveView("overview");
                setAutoOrbit((v) => !v);
              }}
              className={`min-h-[40px] px-3 rounded-lg text-xs font-semibold ${
                autoOrbit ? "btn-primary" : "bg-pane border line-subtle"
              }`}
            >
              {autoOrbit ? "Auto Orbit: On" : "Orbit Bebas"}
            </button>
            <button
              type="button"
              aria-label="Zoom in"
              onClick={() => sceneApiRef.current?.triggerCam("zoomIn")}
              className="min-h-[40px] min-w-[40px] rounded-lg bg-pane border line-subtle text-sm font-bold"
            >
              +
            </button>
            <button
              type="button"
              aria-label="Zoom out"
              onClick={() => sceneApiRef.current?.triggerCam("zoomOut")}
              className="min-h-[40px] min-w-[40px] rounded-lg bg-pane border line-subtle text-sm font-bold"
            >
              -
            </button>
            <button
              type="button"
              onClick={() => {
                setActiveView("overview");
                sceneApiRef.current?.triggerCam("reset");
              }}
              className="min-h-[40px] px-3 rounded-lg bg-pane border line-subtle text-xs font-semibold"
            >
              Reset
            </button>
            <span className="hidden xl:inline px-2 font-mono text-[11px] ink-muted">
              Seret 360° · Scroll zoom · Klik zona 3D
            </span>
          </nav>

          {/* Right Collapsible Studio Content Drawer */}
          {drawerOpen && (
            <main
              id="studio-drawer"
              className="drawer-anim absolute z-30 right-3 sm:right-4 bottom-16 sm:bottom-4 left-3 sm:left-auto sm:w-[410px] top-auto sm:top-[76px] max-h-[60vh] sm:max-h-none rounded-2xl bg-glass border line-subtle flex flex-col overflow-hidden"
            >
              <div className="flex-1 overflow-y-auto p-5">
                {renderActiveContent()}
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MaveyyPortfolio3D />);
  </script>
</body>

</html>
