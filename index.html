<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaveyyVlgd (Muhammad Adhitya Pratama): Personal Archive & Mecut AI Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Syne", "sans-serif"],
            poster: ["Anton", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
            mono: ["IBM Plex Mono", "monospace"],
          },
          colors: {
            acid: "#D4FF00",
            safety: "#FF4D00",
            safetyLight: "#B83200",
            safetyDarkText: "#FF6A2B",
            asphalt: "#0B0B0C",
            concrete: "#151518",
            paper: "#F3EFE6",
          },
        },
      },
    };
  </script>

  <style>
    a[href],
    button:not(:disabled),
    summary,
    select:not(:disabled),
    label[for],
    input[type="checkbox"]:not(:disabled),
    input[type="radio"]:not(:disabled),
    [role="button"]:not([aria-disabled="true"]) {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    select:disabled,
    [aria-disabled="true"] {
      cursor: not-allowed;
    }

    .theme-dark :focus-visible {
      outline: 3px solid #D4FF00;
      outline-offset: 2px;
    }

    .theme-light :focus-visible {
      outline: 3px solid #B83200;
      outline-offset: 2px;
    }

    @keyframes marquee {
      0% {
        transform: translateX(0%);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }

    .animate-marquee.is-paused,
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .animate-marquee {
        animation: none;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script defer src="./src/data/portfolioData.js"></script>
</head>

<body class="antialiased selection:bg-[#D4FF00] selection:text-[#111111] bg-[#0B0B0C] text-[#F3EFE6]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

            <span
              key={i}
              className="bg-current inline-block"
              style={{ width: `${w * 2}px`, opacity: i % 5 === 0 ? 0.65 : 1 }}
            />
          ))}
        </div>
      );
    }

          <rect x="178" y="162" width="44" height="12" fill="#D4FF00" />

          <rect x="130" y="185" width="18" height="44" rx="8" fill="#D4FF00" stroke="#111111" strokeWidth="4" />

          <path d="M24 44 L24 24 L44 24" stroke="#D4FF00" strokeWidth="3" />
          <path d="M376 44 L376 24 L356 24" stroke="#D4FF00" strokeWidth="3" />

    }

    function ProjectPosterSVG({ project }) {
      const accent = project.accentColor || "#D4FF00";
      return (
        <svg
          viewBox="0 0 600 360"
          className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect width="600" height="360" fill="#101013" />
          <circle cx="465" cy="175" r="110" fill={accent} opacity="0.95" />
          <circle
            cx="465"
            cy="175"
            r="128"
            stroke={accent}
            strokeWidth="2"
            strokeDasharray="8 6"
          />
          <rect
            x="38"
            y="46"
            width="320"
            height="268"
            fill="#18181D"
            stroke="#F3EFE6"
            strokeWidth="2.5"
          />

          </text>

          <text
            x="60"
            y="135"
            fill="#F3EFE6"
            fontFamily="Anton, Syne, sans-serif"
            fontSize="28"
            fontWeight="800"
            letterSpacing="1"
          >
            {project.title.split("//")[0].trim()}
          </text>
          <rect x="60" y="154" width="110" height="6" fill={accent} />
          <rect x="60" y="176" width="240" height="10" rx="2" fill="#2E2E38" />
          <rect x="60" y="196" width="195" height="10" rx="2" fill="#2E2E38" />

          <g transform="translate(60, 235)">
            <rect width="136" height="28" fill={accent} />

              x="68"
              y="18"
              textAnchor="middle"
              fill="#111111"
              fontFamily="IBM Plex Mono, monospace"
              fontSize="10"
              fontWeight="700"
            >
              {project.category.toUpperCase()}
            </text>
          </g>

          <text
            x="465"
            y="185"
            textAnchor="middle"
            fill="#111111"

    }

    function PortfolioApp({ data }) {
      const { profile, about, skills, projects, contact } = data;

      const [theme, setTheme] = useState("dark");
      const [marqueePaused, setMarqueePaused] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeProject, setActiveProject] = useState(null);
      const [copiedEmail, setCopiedEmail] = useState(false);
      const [localTime, setLocalTime] = useState("");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [senderName, setSenderName] = useState("");
      const [senderMsg, setSenderMsg] = useState("");
      const [msgSentNotice, setMsgSentNotice] = useState("");

      const modalCloseRef = useRef(null);

      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setLocalTime(
            now.toLocaleTimeString("id-ID", {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            })
          );
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!activeProject) return;
        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            setActiveProject(null);
          }
        };
        window.addEventListener("keydown", onKeyDown);
        if (modalCloseRef.current) {
          modalCloseRef.current.focus();
        }
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [activeProject]);

      const categories = useMemo(() => {
        const unique = Array.from(new Set(projects.map((p) => p.category)));
        return ["ALL", ...unique];
      }, [projects]);

      const filteredProjects = useMemo(() => {
        return projects.filter((project) => {
          const matchesCategory =
            selectedCategory === "ALL" || project.category === selectedCategory;
          const q = searchQuery.trim().toLowerCase();
          const matchesQuery =
            !q ||
            project.title.toLowerCase().includes(q) ||
            project.subtitle.toLowerCase().includes(q) ||
            project.summary.toLowerCase().includes(q) ||
            project.techStack.some((t) => t.toLowerCase().includes(q));
          return matchesCategory && matchesQuery;
        });
      }, [projects, selectedCategory, searchQuery]);

      const primarySkillCategories = skills.categories.slice(0, 2);
      const cultureCategory = skills.categories[2];

      const handleCopyEmail = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(contact.email);
          setCopiedEmail(true);
          setTimeout(() => setCopiedEmail(false), 2500);
        }
      };

      const handleSendQuickMessage = (via) => {
        const nameText = senderName.trim() || "New Friend";
        const bodyText =
          senderMsg.trim() ||
          "Hey Tama (MaveyyVlgd)! Love your projects and would love to connect.";

        if (via === "whatsapp" && contact.whatsappNumber) {
          const text = encodeURIComponent(
            `Hi ${profile.name}! I'm *${nameText}*.\n\n${bodyText}`
          );
          window.open(`https://wa.me/${contact.whatsappNumber}?text=${text}`, "_blank");
          setMsgSentNotice("Opening WhatsApp...");
        } else if (via === "instagram") {
          window.open("https://www.instagram.com/a.prtamaa1/", "_blank");
          setMsgSentNotice("Opening Instagram @a.prtamaa1...");
        } else {
          const subject = encodeURIComponent(
            `[MAVEYYVLGD WEB] Message from ${nameText}`
          );
          const body = encodeURIComponent(
            `Hi ${profile.fullName} (${profile.name}),\n\n${bodyText}\n\nBest,\n${nameText}`
          );
          window.location.href = `mailto:${contact.email}?subject=${subject}&body=${body}`;
          setMsgSentNotice("Opening Email client...");
        }
        setTimeout(() => setMsgSentNotice(""), 3500);
      };

      const isDark = theme === "dark";
      const orangeText = isDark ? "text-[#FF6A2B]" : "text-[#B83200]";
      const mutedText = isDark ? "text-[#A3A3B0]" : "text-[#4A4A52]";
      const showSpotlight =
        selectedCategory === "ALL" && !searchQuery.trim() && filteredProjects.length > 0;

      return (
        <div
          className={`min-h-screen transition-colors duration-300 ${isDark
              ? "theme-dark bg-[#0B0B0C] text-[#F3EFE6]"
              : "theme-light bg-[#F3EFE6] text-[#111111]"
            }`}
          style={{ fontFamily: "'Plus Jakarta Sans', sans-serif" }}
        >
          <a
            href="#main-content"
            className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-3 focus:bg-[#D4FF00] focus:text-[#111111] focus:border-2 focus:border-[#111111] font-mono text-xs font-bold"
          >
            Skip to main content
          </a>

          <div className="bg-[#D4FF00] text-[#111111] border-b-2 border-[#111111] flex items-center">
            <div className="overflow-hidden flex-1 py-2 select-none" aria-hidden="true">
              <div
                className={`animate-marquee font-mono text-xs font-bold tracking-wider ${marqueePaused ? "is-paused" : ""
                  }`}
              >
                {[...profile.marqueeItems, ...profile.marqueeItems].map((item, idx) => (
                  <span key={idx} className="mx-6 inline-flex items-center gap-3">
                    <span className="inline-block w-2 h-2 bg-[#111111] rotate-45" />
                    {item}
                  </span>
                ))}
              </div>
            </div>
            <button
              type="button"
              onClick={() => setMarqueePaused(!marqueePaused)}
              aria-pressed={marqueePaused}
              className="min-h-[44px] min-w-[44px] px-3 border-l-2 border-[#111111] bg-[#D4FF00] text-[#111111] hover:bg-[#111111] hover:text-[#D4FF00] active:translate-y-0.5 font-mono text-[11px] font-bold uppercase shrink-0 transition-colors"
            >
              {marqueePaused ? "Play" : "Pause"}
            </button>
          </div>

          <header
            className={`sticky top-0 z-40 backdrop-blur-md border-b-2 transition-colors ${isDark
                ? "bg-[#0B0B0C]/95 border-[#282830]"
                : "bg-[#F3EFE6]/95 border-[#111111]"
              }`}
          >
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
              <a
                href="#hero"
                className="flex items-center gap-3 group min-h-[44px]"
              >
                <div className="bg-[#D4FF00] text-[#111111] font-mono font-bold text-sm px-2.5 py-1.5 border-2 border-[#111111] shadow-[3px_3px_0px_#FF4D00] group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform">
                  {profile.nickname}
                </div>
                <div className="hidden sm:flex flex-col">
                  <span className={`font-mono text-[11px] tracking-wide ${mutedText}`}>
                    {profile.editionTag}
                  </span>
                  <span className="font-bold text-xs tracking-wide">
                    {profile.location}
                  </span>
                </div>
              </a>

              <nav
                aria-label="Primary navigation"
                className="hidden md:flex items-center gap-1 lg:gap-2 font-mono text-xs font-bold"
              >
                {[
                  { href: "#hero", label: "01 // Home" },
                  { href: "#about", label: "02 // About" },
                  { href: "#skills", label: "03 // Specs" },
                  { href: "#projects", label: "04 // Drops" },
                  { href: "#contact", label: "05 // Contact" },
                ].map((nav) => (
                  <a
                    key={nav.href}
                    href={nav.href}
                    className={`min-h-[44px] inline-flex items-center px-3 border border-transparent transition-colors ${isDark
                        ? "hover:border-[#D4FF00] hover:bg-[#16161B] hover:text-[#D4FF00]"
                        : "hover:border-[#111111] hover:bg-[#D4FF00] hover:text-[#111111]"
                      }`}
                  >
                    {nav.label}
                  </a>
                ))}
              </nav>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setTheme(isDark ? "light" : "dark")}
                  aria-pressed={!isDark}
                  className={`min-h-[44px] font-mono text-xs font-bold px-3 border-2 transition-colors active:translate-y-0.5 flex items-center gap-2 ${isDark
                      ? "bg-[#16161B] text-[#F3EFE6] border-[#F3EFE6] hover:bg-[#D4FF00] hover:text-[#111111] hover:border-[#D4FF00]"
                      : "bg-[#111111] text-[#F3EFE6] border-[#111111] hover:bg-[#FF4D00] hover:text-[#111111]"
                    }`}
                >
                  <span
                    aria-hidden="true"
                    className={`w-2.5 h-2.5 rounded-full ${isDark ? "bg-[#D4FF00]" : "bg-[#FF4D00]"
                      }`}
                  />
                  {isDark ? "Asphalt" : "Zine Paper"}
                </button>

                <button
                  type="button"
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  aria-expanded={mobileMenuOpen}
                  aria-controls="mobile-nav"
                  className={`md:hidden min-h-[44px] min-w-[44px] px-3 border-2 font-mono text-xs font-bold active:translate-y-0.5 ${isDark
                      ? "border-[#F3EFE6] text-[#F3EFE6]"
                      : "border-[#111111] text-[#111111]"
                    }`}
                >
                  {mobileMenuOpen ? "Close" : "Menu"}
                </button>
              </div>
            </div>

            {mobileMenuOpen && (
              <nav
                id="mobile-nav"
                aria-label="Mobile navigation"
                className={`md:hidden border-t-2 px-4 py-4 space-y-2 font-mono text-sm font-bold ${isDark
                    ? "bg-[#121216] border-[#282830]"
                    : "bg-[#F3EFE6] border-[#111111]"
                  }`}
              >
                {[
                  { href: "#hero", label: "01 // Home" },
                  { href: "#about", label: "02 // About Me" },
                  { href: "#skills", label: "03 // The Arsenal" },
                  { href: "#projects", label: "04 // Selected Drops" },
                  { href: "#contact", label: "05 // Contact & Socials" },
                ].map((nav) => (
                  <a
                    key={nav.href}
                    href={nav.href}
                    onClick={() => setMobileMenuOpen(false)}
                    className={`min-h-[44px] flex items-center px-3 border transition-colors ${isDark
                        ? "border-[#2E2E38] hover:bg-[#D4FF00] hover:text-[#111111]"
                        : "border-[#111111] hover:bg-[#D4FF00] hover:text-[#111111]"
                      }`}
                  >
                    {nav.label}
                  </a>
                ))}
              </nav>
            )}
          </header>

          <main id="main-content" className="overflow-x-clip">
            <section
              id="hero"
              className="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 lg:pt-14 lg:pb-24"
            >
              <div
                className={`flex flex-wrap items-center justify-between gap-4 pb-5 mb-8 border-b-2 font-mono text-xs ${isDark ? "border-[#282830]" : "border-[#111111]"
                  }`}
              >
                <div className="flex items-center gap-3">
                  <span className="inline-flex items-center px-2.5 py-1 bg-[#FF4D00] text-[#111111] font-bold">
                    {profile.status}
                  </span>
                  <span className={`hidden sm:inline ${mutedText}`}>
                    SN: {profile.serialCode}
                  </span>
                </div>
                <div className={`flex items-center gap-4 ${mutedText}`}>
                  <span>COORDS // {profile.coordinates}</span>
                  {localTime && (
                    <span
                      className={`px-2 py-0.5 border font-bold ${isDark
                          ? "border-[#F3EFE6] text-[#F3EFE6]"
                          : "border-[#111111] text-[#111111]"
                        }`}
                    >
                      WIB {localTime}
                    </span>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-8 items-center">
                <div className="lg:col-span-7 space-y-6">
                  <p className={`font-mono text-xs font-bold tracking-wide ${orangeText}`}>
                    {profile.role}
                  </p>

                  <h1
                    className="text-3xl sm:text-6xl xl:text-7xl font-extrabold uppercase leading-[0.98] tracking-tight break-words"
                    style={{ fontFamily: "'Syne', 'Anton', sans-serif" }}
                  >
                    <span className="block">{profile.headlineTop}</span>
                    <span className="inline-block bg-[#D4FF00] text-[#111111] px-3 py-1 my-1.5 border-2 border-[#111111] shadow-[5px_5px_0px_#FF4D00] transform -rotate-1">
                      {profile.headlineAccent}
                    </span>
                    {profile.headlineBottom && (
                      <span className="block">{profile.headlineBottom}</span>
                    )}
                  </h1>

                  <p className="text-base sm:text-lg max-w-2xl leading-relaxed font-medium">
                    {profile.shortBio}
                  </p>

                  <div className="pt-2 flex flex-wrap items-center gap-4">
                    <a
                      href="#projects"
                      className="min-h-[44px] inline-flex items-center px-7 py-3.5 bg-[#D4FF00] text-[#111111] font-mono text-sm font-bold border-2 border-[#111111] shadow-[5px_5px_0px_#FF4D00] hover:translate-x-0.5 hover:-translate-y-0.5 active:translate-y-0.5 transition-all"
                    >
                      VIEW {projects.length} PROJECTS
                    </a>
                    <a
                      href="#contact"
                      className={`min-h-[44px] inline-flex items-center px-7 py-3.5 font-mono text-sm font-bold border-2 transition-colors active:translate-y-0.5 ${isDark
                          ? "bg-[#16161B] text-[#F3EFE6] border-[#F3EFE6] hover:bg-[#FF4D00] hover:border-[#FF4D00] hover:text-[#111111]"
                          : "bg-white text-[#111111] border-[#111111] shadow-[5px_5px_0px_#111111] hover:bg-[#FF4D00] hover:text-[#111111]"
                        }`}
                    >
                      CONTACT & COLLAB
                    </a>
                  </div>

                  <div className="pt-4 grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-5">
                    {profile.stats.map((st, idx) => (
                      <div
                        key={idx}
                        className={`p-4 border-2 ${isDark
                            ? "bg-[#141418] border-[#2C2C35]"
                            : "bg-white border-[#111111] shadow-[4px_4px_0px_#111111]"

                            rel="noreferrer"
                            className={`min-h-[44px] p-4 border-2 flex items-center justify-between group transition-all hover:-translate-y-0.5 ${isDark
                                ? "bg-[#15151A] border-[#2E2E38] hover:border-[#D4FF00]"
                                : "bg-white border-[#111111] shadow-[4px_4px_0px_#111111] hover:bg-[#D4FF00]"
                              }`}
                          >
                            <div>
                              <div className={`font-mono text-[11px] font-bold ${orangeText}`}>
                                {soc.tag}
                              </div>
                              <div
                                className="text-lg font-extrabold uppercase"
                                style={{ fontFamily: "'Syne', sans-serif" }}
                              >
                                {soc.platform}
                              </div>
                              <div className={`font-mono text-xs ${mutedText}`}>
                                {soc.handle}
                              </div>
                            </div>
                            <span className="font-mono text-xs font-bold underline">
                              OPEN
                            </span>
                          </a>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-5">
                    <div
                      className={`p-6 sm:p-8 border-2 ${isDark
                          ? "bg-[#16161C] border-[#F3EFE6] shadow-[8px_8px_0px_#FF4D00]"
                          : "bg-white border-[#111111] shadow-[8px_8px_0px_#111111]"
                        }`}
                    >
                      <div className="flex items-center justify-between pb-4 mb-6 border-b-2 border-current">
                        <div>
                          <div className={`font-mono text-[11px] font-bold ${orangeText}`}>
                            INSTANT DISPATCH
                          </div>
                          <h3
                            className="text-2xl font-extrabold uppercase"
                            style={{ fontFamily: "'Syne', sans-serif" }}
                          >
                            SEND A MESSAGE
                          </h3>
                        </div>
                        <BarcodeGraphic className="h-7" />
                      </div>

                      <div className="space-y-4">
                        <div>
                          <label
                            htmlFor="sender-name"
                            className="block font-mono text-xs font-bold mb-1.5"
                          >
                            01 // Your Name or Brand
                          </label>
                          <input
                            id="sender-name"
                            type="text"
                            value={senderName}
                            onChange={(e) => setSenderName(e.target.value)}
                            placeholder="e.g., Alex / Creative Studio"
                            className={`min-h-[44px] w-full px-3.5 py-2.5 border-2 font-mono text-sm ${isDark
                                ? "bg-[#0B0B0C] border-[#2E2E38] text-[#F3EFE6] placeholder:text-[#A3A3B0]"
                                : "bg-[#F3EFE6] border-[#111111] text-[#111111] placeholder:text-[#4A4A52]"
                              }`}
                          />
                        </div>

                        <div>
                          <label
                            htmlFor="sender-msg"
                            className="block font-mono text-xs font-bold mb-1.5"
                          >
                            02 // Project Details or Message
                          </label>
                          <textarea
                            id="sender-msg"
                            rows={4}
                            value={senderMsg}
                            onChange={(e) => setSenderMsg(e.target.value)}
                            placeholder="Tell me about your project idea, collaboration, or just say hi..."
                            className={`w-full px-3.5 py-2.5 border-2 font-mono text-sm ${isDark
                                ? "bg-[#0B0B0C] border-[#2E2E38] text-[#F3EFE6] placeholder:text-[#A3A3B0]"
                                : "bg-[#F3EFE6] border-[#111111] text-[#111111] placeholder:text-[#4A4A52]"
                              }`}
                          />
                        </div>

                        {msgSentNotice && (
                          <div
                            role="status"
                            className="p-3 bg-[#D4FF00] text-[#111111] font-mono text-xs font-bold"
                          >
                            {msgSentNotice}
                          </div>
                        )}

                        <div className="pt-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <button
                            type="button"
                            onClick={() => handleSendQuickMessage("email")}
                            className="min-h-[44px] w-full py-3 px-4 bg-[#D4FF00] text-[#111111] border-2 border-[#111111] font-mono text-xs font-bold hover:bg-[#FF4D00] hover:text-[#111111] active:translate-y-0.5 transition-colors"
                          >
                            SEND VIA EMAIL
                          </button>
                          <button
                            type="button"
                            onClick={() =>
                              handleSendQuickMessage(
                                contact.whatsappNumber ? "whatsapp" : "instagram"
                              )
                            }
                            className={`min-h-[44px] w-full py-3 px-4 border-2 font-mono text-xs font-bold active:translate-y-0.5 transition-colors ${isDark
                                ? "bg-[#111111] text-[#F3EFE6] border-[#F3EFE6] hover:bg-[#D4FF00] hover:text-[#111111] hover:border-[#D4FF00]"
                                : "bg-[#111111] text-white border-[#111111] hover:bg-[#FF4D00] hover:text-[#111111]"
                              }`}
                          >
                            {contact.whatsappNumber
                              ? "CHAT WHATSAPP"
                              : "DM INSTAGRAM"}
                          </button>
                        </div>
                      </div>

                      <div className={`mt-6 pt-4 border-t border-current/20 font-mono text-xs ${mutedText}`}>
                        BASE: {contact.locationNote}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer
            className={`border-t-2 py-8 font-mono text-xs ${isDark
                ? "bg-[#08080A] border-[#282830] text-[#F3EFE6]"
                : "bg-[#111111] border-[#111111] text-[#F3EFE6]"
              }`}
          >
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex flex-wrap items-center justify-center sm:justify-start gap-3">
                <span className="px-2 py-1 bg-[#D4FF00] text-[#111111] font-bold">
                  {profile.nickname}
                </span>
                <span>
                  © {new Date().getFullYear()} {profile.fullName}. All rights reserved.
                </span>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-[#A3A3B0]">STREETWEAR ARCHIVE EDITION</span>
                <a
                  href="#hero"
                  className="min-h-[44px] inline-flex items-center px-3 border border-[#D4FF00] text-[#D4FF00] font-bold hover:bg-[#D4FF00] hover:text-[#111111] transition-colors"
                >
                  BACK TO TOP
                </a>
              </div>
            </div>
          </footer>

          {activeProject && (
            <div
              role="dialog"
              aria-modal="true"
              aria-labelledby="modal-project-title"
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setActiveProject(null)}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`max-w-2xl w-full border-2 p-6 sm:p-8 relative my-8 ${isDark
                    ? "bg-[#141419] text-[#F3EFE6] border-[#D4FF00] shadow-[10px_10px_0px_#D4FF00]"
                    : "bg-[#F3EFE6] text-[#111111] border-[#111111] shadow-[10px_10px_0px_#FF4D00]"
                  }`}
              >
                <div className="flex items-center justify-between gap-3 pb-4 mb-6 border-b-2 border-current">
                  <div className="font-mono text-xs font-bold">
                    <span className="px-2 py-1 bg-[#FF4D00] text-[#111111] mr-2">
                      {activeProject.dropNumber}
                    </span>
                    <span>
                      {activeProject.category} // {activeProject.year}
                    </span>
                  </div>
                  <button
                    ref={modalCloseRef}
                    type="button"
                    onClick={() => setActiveProject(null)}
                    className="min-h-[44px] font-mono text-xs font-bold px-3.5 py-2 bg-[#D4FF00] text-[#111111] border-2 border-[#111111] hover:bg-[#FF4D00] active:translate-y-0.5 transition-colors"
                  >
                    CLOSE [ESC]
                  </button>
                </div>

                <h3
                  id="modal-project-title"
                  className="text-2xl sm:text-4xl font-extrabold uppercase"
                  style={{ fontFamily: "'Syne', sans-serif" }}
                >
                  {activeProject.title}
                </h3>
                <p className={`font-mono text-xs font-bold mt-1 ${orangeText}`}>
                  {activeProject.subtitle}
                </p>

                <div className="mt-5 space-y-4 text-sm sm:text-base">
                  <p className="leading-relaxed">{activeProject.summary}</p>

                  {activeProject.challenge && (
                    <div
                      className={`p-4 border-l-4 border-[#D4FF00] ${isDark ? "bg-[#0B0B0C]" : "bg-white border border-[#111111]"
                        }`}
                    >
                      <div className={`font-mono text-xs font-bold mb-1 ${orangeText}`}>
                        // THE CHALLENGE & CONCEPT
                      </div>
                      <p className="text-sm leading-relaxed">
                        {activeProject.challenge}
                      </p>
                    </div>
                  )}

                  {activeProject.features && (
                    <div>
                      <div className="font-mono text-xs font-bold mb-2">
                        // KEY FEATURES & SPECS
                      </div>
                      <ul className="space-y-1.5 text-sm list-disc pl-5">
                        {activeProject.features.map((feat, i) => (
                          <li key={i}>{feat}</li>
                        ))}
                      </ul>
                    </div>
                  )}

                  <div className="pt-2">
                    <div className="font-mono text-xs font-bold mb-2">
                      // TECH STACK
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {activeProject.techStack.map((t, i) => (
                        <span
                          key={i}
                          className="font-mono text-xs font-bold px-2.5 py-1 bg-[#D4FF00] text-[#111111] border border-[#111111]"
                        >
                          #{t}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="mt-8 pt-4 border-t-2 border-current flex flex-wrap items-center justify-between gap-4">
                  <div className="flex flex-wrap items-center gap-3">
                    {activeProject.liveUrl && (
                      <a
                        href={activeProject.liveUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="min-h-[44px] inline-flex items-center px-5 py-2.5 bg-[#D4FF00] text-[#111111] border-2 border-[#111111] font-mono text-xs font-bold hover:bg-[#FF4D00] transition-colors"
                      >
                        OPEN LIVE APP
                      </a>
                    )}
                    {activeProject.repoUrl && (
                      <a
                        href={activeProject.repoUrl}
                        target="_blank"
                        rel="noreferrer"
                        className="min-h-[44px] inline-flex items-center px-5 py-2.5 border-2 border-current font-mono text-xs font-bold hover:bg-[#D4FF00] hover:text-[#111111] hover:border-[#111111] transition-colors"
                      >
                        VIEW SOURCE CODE
                      </a>
                    )}
                  </div>
                  <BarcodeGraphic className="h-6" />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PortfolioApp data={window.PORTFOLIO_DATA} />);
  </script>
</body>

</html>
